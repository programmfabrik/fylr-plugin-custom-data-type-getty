plugin:
  name: custom-data-type-getty
  version: 2.0
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-getty
  displayname:
    de-DE: getty-Verknüpfung
    en-US: getty-Referencing
  info:
    de-DE: |
      Stellt einen eigenen Feldtyp bereit, mit dem Datensätze mit Konzepten der [Getty Vocabularies](https://www.getty.edu/research/tools/vocabularies/) verknüpft werden. Redakteure suchen und hinterlegen eine eindeutige Referenz, statt Begriffe als Freitext zu erfassen.

      - Auswahl der genutzten Vokabulare: AAT, TGN und/oder ULAN
      - Suche optional auf einen Startknoten innerhalb eines hierarchischen Vokabulars eingrenzen
      - Optionale Vorschau mit Zusatzinformationen beim Überfahren eines Vorschlags
      - Optionaler nächtlicher Updater hält die Daten mit der Getty-Quelle synchron
    en-US: |
      Adds a custom data type for linking records to concepts in the [Getty Vocabularies](https://www.getty.edu/research/tools/vocabularies/). Editors search and attach an authoritative reference instead of typing terms as free text.

      - Choose which vocabularies a field uses: AAT, TGN and/or ULAN
      - Optionally scope the search to a starting node within a hierarchical vocabulary
      - Optional hover preview with additional information on each suggestion
      - Optional nightly updater keeps stored data in sync with the Getty source
  l10n: l10n/customDataTypeGetty.csv
  webfrontend:
    url: customDataTypeGetty.js
    css: customDataTypeGetty.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  getty:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      conceptGeoJSON:
        type: geo_json
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      schema:
        - name: add_aat
          parameters:
            value:
              type: bool
        - name: add_tgn
          parameters:
            value:
              type: bool
        - name: add_ulan
          parameters:
            value:
              type: bool
        - name: start_parent_id
          parameters:
            value:
              type: text
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]

    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/GettyUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1

base_config:
  - name: update_getty
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 3
